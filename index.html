<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Финансовый Календарь — Vernal</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Финансы">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
      background-attachment: fixed;
      color: #f8fafc;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(25px) saturate(190%);
      -webkit-backdrop-filter: blur(25px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      color: #f8fafc;
    }

    .glass-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(99, 102, 241, 0.6);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.25);
      outline: none;
    }

    .day-card {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.25s ease;
    }

    .weekend-card {
      background: rgba(225, 29, 72, 0.06);
      border: 1px solid rgba(244, 63, 94, 0.15);
    }

    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    select option {
      background-color: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen p-3 sm:p-8 flex justify-center items-center">

  <div class="max-w-7xl w-full flex flex-col gap-6">
    
    <!-- HEADER -->
    <header class="glass-card rounded-3xl p-5 sm:p-8 flex flex-col gap-6">
      
      <div class="flex flex-col md:flex-row justify-between items-center gap-6">
        <!-- Title & Month Picker -->
        <div class="flex items-center gap-4 w-full md:w-auto">
          <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-pink-500 flex items-center justify-center text-2xl shadow-lg border border-white/10">
            💎
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">
                Финансы Vernal
              </h1>
              <span id="sync-badge" class="px-2.5 py-0.5 text-[10px] font-bold rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
                Офлайн
              </span>
            </div>
            
            <!-- Month Selector -->
            <div class="flex items-center gap-2 mt-1">
              <select id="month-select" onchange="changeMonth()" 
                class="glass-input px-2.5 py-1 rounded-xl text-xs font-bold text-indigo-300 cursor-pointer border border-white/10">
                <!-- Populated by JS -->
              </select>
            </div>
          </div>
        </div>

        <!-- Secret Key Input Box -->
        <div class="flex items-center gap-2 w-full md:w-auto glass-card p-2 rounded-2xl border border-white/10">
          <span class="text-xs font-semibold text-slate-400 pl-2">🔑 Код:</span>
          <input type="text" id="secret-key-input" placeholder="Придумайте код" 
            class="glass-input px-3 py-1.5 rounded-xl text-xs font-mono font-bold text-indigo-300 w-full md:w-40 tracking-wider">
          <button onclick="saveAndConnectKey()" class="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white transition-colors">
            Подключить
          </button>
        </div>
      </div>

      <!-- Quick Metrics Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full">
        <div class="glass-card rounded-2xl p-4 flex flex-col justify-between border-emerald-500/20 bg-emerald-950/10">
          <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">💵 Доход</span>
          <div class="flex items-center gap-1 mt-2">
            <input type="number" id="monthly-income" value="100000" placeholder="0" 
              class="glass-input w-full px-2 py-1 rounded-lg text-lg font-bold text-emerald-300 focus:bg-emerald-950/40"
              oninput="handleInput()">
            <span class="text-emerald-400 font-bold">₽</span>
          </div>
        </div>

        <div class="glass-card rounded-2xl p-4 flex flex-col justify-between border-rose-500/20 bg-rose-950/10">
          <span class="text-xs font-semibold text-rose-400 uppercase tracking-wider">💸 Расходы</span>
          <div class="text-lg sm:text-xl font-bold text-rose-300 mt-2" id="monthly-expenses">0 ₽</div>
        </div>

        <div class="glass-card rounded-2xl p-4 flex flex-col justify-between border-indigo-500/20 bg-indigo-950/10">
          <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">⚖️ Остаток</span>
          <div class="text-lg sm:text-xl font-bold text-indigo-200 mt-2" id="monthly-balance">100 000 ₽</div>
        </div>
      </div>

    </header>

    <!-- CALENDAR GRID -->
    <main class="glass-card rounded-3xl p-4 sm:p-8 overflow-x-auto">
      <div class="grid grid-cols-7 gap-2.5 min-w-[850px] mb-4 text-center font-bold text-xs tracking-wider uppercase">
        <div class="py-2 rounded-xl bg-slate-800/40 text-slate-400 border border-white/5">ПН</div>
        <div class="py-2 rounded-xl bg-slate-800/40 text-slate-400 border border-white/5">ВТ</div>
        <div class="py-2 rounded-xl bg-slate-800/40 text-slate-400 border border-white/5">СР</div>
        <div class="py-2 rounded-xl bg-slate-800/40 text-slate-400 border border-white/5">ЧТ</div>
        <div class="py-2 rounded-xl bg-slate-800/40 text-slate-400 border border-white/5">ПТ</div>
        <div class="py-2 rounded-xl bg-rose-950/20 text-rose-400 border border-rose-500/10">СБ</div>
        <div class="py-2 rounded-xl bg-rose-950/20 text-rose-400 border border-rose-500/10">ВС</div>
      </div>

      <div id="calendar-grid" class="grid grid-cols-7 gap-2.5 min-w-[850px]"></div>
    </main>

  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://vernal-s-finance-default-rtdb.firebaseio.com"
    };

    const MONTH_NAMES = [
      "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", 
      "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
    ];

    let dbRef = null;
    let isRemoteUpdate = false;
    let userSecretKey = localStorage.getItem('vernal_finance_secret_key') || '';
    
    // Сохранение и выбор месяца (по умолчанию Октябрь 2026)
    let selectedYear = parseInt(localStorage.getItem('vernal_finance_year')) || 2026;
    let selectedMonth = parseInt(localStorage.getItem('vernal_finance_month')) || 9; // 0-indexed (9 = Октябрь)

    function populateMonthSelect() {
      const select = document.getElementById('month-select');
      select.innerHTML = '';

      // Генерация месяцев от Октября 2026 до Декабря 2027
      const range = [
        { year: 2026, startMonth: 9, endMonth: 11 },
        { year: 2027, startMonth: 0, endMonth: 11 }
      ];

      range.forEach(item => {
        for (let m = item.startMonth; m <= item.endMonth; m++) {
          const opt = document.createElement('option');
          opt.value = `${item.year}-${m}`;
          opt.innerText = `${MONTH_NAMES[m]} ${item.year}`;
          if (item.year === selectedYear && m === selectedMonth) {
            opt.selected = true;
          }
          select.appendChild(opt);
        }
      });
    }

    function changeMonth() {
      const val = document.getElementById('month-select').value.split('-');
      selectedYear = parseInt(val[0]);
      selectedMonth = parseInt(val[1]);

      localStorage.setItem('vernal_finance_year', selectedYear);
      localStorage.setItem('vernal_finance_month', selectedMonth);

      initCalendar();
    }

    function initCalendar() {
      populateMonthSelect();

      const keyInput = document.getElementById('secret-key-input');
      if (userSecretKey) keyInput.value = userSecretKey;

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      // Вычисление количества дней и первого дня недели
      const daysInMonth = new Date(selectedYear, selectedMonth + 1, 0).getDate();
      let firstDayIndex = new Date(selectedYear, selectedMonth, 1).getDay(); // 0 = ВС
      firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1; // Преобразуем к ПН=0 ... ВС=6

      // Пустые клетки для смещения
      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'rounded-2xl p-3 opacity-20 border border-white/5 bg-slate-900/20 min-h-[140px]';
        grid.appendChild(emptyCell);
      }

      // Генерация дней месяца
      for (let day = 1; day <= daysInMonth; day++) {
        const dayOfWeek = (firstDayIndex + day - 1) % 7;
        const isWeekend = dayOfWeek === 5 || dayOfWeek === 6;

        const dayCard = document.createElement('div');
        dayCard.className = `day-card rounded-2xl p-3 flex flex-col justify-between min-h-[145px] ${isWeekend ? 'weekend-card' : ''}`;

        dayCard.innerHTML = `
          <div class="flex justify-between items-center mb-2 pb-1 border-b border-white/5">
            <span class="text-sm font-extrabold ${isWeekend ? 'text-rose-400' : 'text-slate-300'}">${day}</span>
            <span class="text-[10px] font-medium text-slate-500 uppercase">${getDayName(dayOfWeek)}</span>
          </div>
          <div class="flex flex-col gap-1.5 my-auto">
            <div class="flex items-center justify-between text-xs gap-1">
              <span class="text-slate-400 text-[11px]">🍔 Еда</span>
              <input type="number" id="day-${day}-food" placeholder="0" 
                class="glass-input w-16 px-1.5 py-0.5 rounded-md text-right text-xs font-semibold text-slate-200"
                oninput="handleInput()">
            </div>
            <div class="flex items-center justify-between text-xs gap-1">
              <span class="text-slate-400 text-[11px]">👔 Вещи</span>
              <input type="number" id="day-${day}-clothes" placeholder="0" 
                class="glass-input w-16 px-1.5 py-0.5 rounded-md text-right text-xs font-semibold text-slate-200"
                oninput="handleInput()">
            </div>
            <div class="flex items-center justify-between text-xs gap-1">
              <span class="text-slate-400 text-[11px]">🎉 Доп</span>
              <input type="number" id="day-${day}-extra" placeholder="0" 
                class="glass-input w-16 px-1.5 py-0.5 rounded-md text-right text-xs font-semibold text-slate-200"
                oninput="handleInput()">
            </div>
          </div>
          <div class="mt-2 pt-1.5 border-t border-white/5 flex justify-between items-center text-[11px]">
            <span class="text-slate-500 font-medium">Итог:</span>
            <span id="day-${day}-total" class="font-bold text-emerald-400">0 ₽</span>
          </div>
        `;
        grid.appendChild(dayCard);
      }

      if (userSecretKey) {
        initFirebaseSync();
      }
    }

    function getDayName(index) {
      return ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'][index];
    }

    function saveAndConnectKey() {
      const val = document.getElementById('secret-key-input').value.trim();
      if (!val) {
        alert('Пожалуйста, введите код!');
        return;
      }
      userSecretKey = val;
      localStorage.setItem('vernal_finance_secret_key', userSecretKey);
      initFirebaseSync();
    }

    function getMonthPath() {
      return `users/${userSecretKey}/${selectedYear}_${selectedMonth}`;
    }

    function initFirebaseSync() {
      if (!userSecretKey) return;
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        
        if (dbRef) dbRef.off();

        dbRef = firebase.database().ref(getMonthPath());

        dbRef.on('value', (snapshot) => {
          const data = snapshot.val() || {};
          isRemoteUpdate = true;
          applyData(data);
          isRemoteUpdate = false;
          updateBadge(true);
        });
      } catch (e) {
        console.error('Sync error:', e);
        updateBadge(false);
      }
    }

    function handleInput() {
      calculateTotals();
      if (!isRemoteUpdate && dbRef) {
        saveToCloud();
      }
    }

    function calculateTotals() {
      const daysInMonth = new Date(selectedYear, selectedMonth + 1, 0).getDate();
      let totalMonthlyExpenses = 0;

      for (let day = 1; day <= daysInMonth; day++) {
        const foodEl = document.getElementById(`day-${day}-food`);
        if (!foodEl) continue;

        const food = parseFloat(foodEl.value) || 0;
        const clothes = parseFloat(document.getElementById(`day-${day}-clothes`).value) || 0;
        const extra = parseFloat(document.getElementById(`day-${day}-extra`).value) || 0;
        const daySum = food + clothes + extra;
        totalMonthlyExpenses += daySum;
        document.getElementById(`day-${day}-total`).innerText = `${daySum.toLocaleString('ru-RU')} ₽`;
      }

      const income = parseFloat(document.getElementById('monthly-income').value) || 0;
      const balance = income - totalMonthlyExpenses;

      document.getElementById('monthly-expenses').innerText = `${totalMonthlyExpenses.toLocaleString('ru-RU')} ₽`;
      document.getElementById('monthly-balance').innerText = `${balance.toLocaleString('ru-RU')} ₽`;
    }

    function saveToCloud() {
      const daysInMonth = new Date(selectedYear, selectedMonth + 1, 0).getDate();
      const dataToSave = {
        income: document.getElementById('monthly-income').value || 0
      };

      for (let day = 1; day <= daysInMonth; day++) {
        const foodEl = document.getElementById(`day-${day}-food`);
        if (!foodEl) continue;
        dataToSave[`d${day}_f`] = foodEl.value || '';
        dataToSave[`d${day}_c`] = document.getElementById(`day-${day}-clothes`).value || '';
        dataToSave[`d${day}_e`] = document.getElementById(`day-${day}-extra`).value || '';
      }

      dbRef.set(dataToSave);
    }

    function applyData(data) {
      const daysInMonth = new Date(selectedYear, selectedMonth + 1, 0).getDate();
      document.getElementById('monthly-income').value = data.income !== undefined ? data.income : 100000;

      for (let day = 1; day <= daysInMonth; day++) {
        const foodEl = document.getElementById(`day-${day}-food`);
        if (!foodEl) continue;

        foodEl.value = data[`d${day}_f`] || '';
        document.getElementById(`day-${day}-clothes`).value = data[`d${day}_c`] || '';
        document.getElementById(`day-${day}-extra`).value = data[`d${day}_e`] || '';
      }
      calculateTotals();
    }

    function updateBadge(isOnline) {
      const badge = document.getElementById('sync-badge');
      if (isOnline) {
        badge.innerText = '● Синхронизировано';
        badge.className = 'px-2.5 py-0.5 text-[10px] font-bold rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
      } else {
        badge.innerText = 'Офлайн';
        badge.className = 'px-2.5 py-0.5 text-[10px] font-bold rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30';
      }
    }

    window.onload = initCalendar;
  </script>
</body>
</html>
